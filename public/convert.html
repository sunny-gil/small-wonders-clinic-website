<!DOCTYPE html>
<html>
<head>
  <title>PDF to PNG Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  </script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    canvas { border: 1px solid #ccc; background: white; margin-top: 10px; }
    textarea { width: 100%; height: 200px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Converting logo.pdf to transparent logo.png...</h1>
  <div id="status">Loading PDF...</div>
  <textarea id="output" placeholder="Base64 output will appear here..."></textarea>
  <br>
  <h3>Preview:</h3>
  <div id="preview-container"></div>

  <script>
    async function convert() {
      try {
        const status = document.getElementById('status');
        status.textContent = 'Fetching logo.pdf...';
        
        const loadingTask = pdfjsLib.getDocument('/logo.pdf');
        const pdf = await loadingTask.promise;
        status.textContent = 'PDF loaded. Rendering page 1...';
        
        const page = await pdf.getPage(1);
        const scale = 4.0; // high res for crispness
        const viewport = page.getViewport({ scale });
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        status.textContent = 'Rendering onto canvas...';
        await page.render({ canvasContext: context, viewport }).promise;
        
        status.textContent = 'Analyzing pixels for cropping...';
        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
        const { data, width, height } = imgData;
        
        // Find bounding box of non-white / non-transparent pixels
        let minX = width;
        let maxX = 0;
        let minY = height;
        let maxY = 0;
        
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const idx = (width * y + x) << 2;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            
            // Check if pixel is not white and not transparent
            // (if transparent or very close to white, we ignore it)
            const isWhite = r > 240 && g > 240 && b > 240;
            const isTransparent = a < 15;
            
            if (!isWhite && !isTransparent) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        
        if (maxX < minX || maxY < minY) {
          status.textContent = 'Error: Bounding box empty. No content found.';
          return;
        }
        
        // Add some padding to the cropped area
        const padding = 10;
        minX = Math.max(0, minX - padding);
        minY = Math.max(0, minY - padding);
        maxX = Math.min(width - 1, maxX + padding);
        maxY = Math.min(height - 1, maxY + padding);
        
        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        
        status.textContent = `Cropping image to ${cropW}x${cropH}...`;
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');
        
        // Draw the cropped portion to cropCanvas
        cropCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
        
        // Convert to transparent background: change white pixels inside bounding box to transparent
        const croppedImgData = cropCtx.getImageData(0, 0, cropW, cropH);
        const cData = croppedImgData.data;
        for (let i = 0; i < cData.length; i += 4) {
          const r = cData[i];
          const g = cData[i+1];
          const b = cData[i+2];
          // If pixel is white or very close to white, make it transparent
          if (r > 245 && g > 245 && b > 245) {
            cData[i+3] = 0; // Alpha = 0
          }
        }
        cropCtx.putImageData(croppedImgData, 0, 0);
        
        status.textContent = 'Conversion complete!';
        const dataUrl = cropCanvas.toDataURL('image/png');
        document.getElementById('output').value = dataUrl;
        
        const previewImg = document.createElement('img');
        previewImg.src = dataUrl;
        previewImg.style.maxWidth = '100%';
        previewImg.style.border = '2px dashed red';
        document.getElementById('preview-container').appendChild(previewImg);
        
      } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
        console.error(err);
      }
    }
    
    window.onload = convert;
  </script>
</body>
</html>
